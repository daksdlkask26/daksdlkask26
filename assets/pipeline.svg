<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" role="img" aria-label="Computer vision pipeline: data, model, train and evaluate, deploy">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }

    .card-bg  { fill: #f6f8fa; }
    .card-bd  { fill: none; stroke: #d0d7de; stroke-width: 1; }
    .stage-bg { fill: #ffffff; }
    .track    { fill: #d0d7de; }
    .t-title  { fill: #1f2328; }
    .t-subtle { fill: #6e7781; }
    .live     { fill: #1a7f37; }

    .c1 { fill: #0969da; } .s1 { stroke: #0969da; }
    .c2 { fill: #bf3989; } .s2 { stroke: #bf3989; }
    .c3 { fill: #8250df; } .s3 { stroke: #8250df; }
    .c4 { fill: #1a7f37; } .s4 { stroke: #1a7f37; }

    @media (prefers-color-scheme: dark) {
      .card-bg  { fill: #161b22; }
      .card-bd  { stroke: #30363d; }
      .stage-bg { fill: #0d1117; }
      .track    { fill: #30363d; }
      .t-title  { fill: #e6edf3; }
      .t-subtle { fill: #848d97; }
      .live     { fill: #3fb950; }

      .c1 { fill: #58a6ff; } .s1 { stroke: #58a6ff; }
      .c2 { fill: #f778ba; } .s2 { stroke: #f778ba; }
      .c3 { fill: #a371f7; } .s3 { stroke: #a371f7; }
      .c4 { fill: #3fb950; } .s4 { stroke: #3fb950; }
    }

    .stage { fill: none; stroke-width: 1; stroke-opacity: .7; }
    .flow  { stroke-width: 2; stroke-dasharray: 4 10; animation: flow 1.2s linear infinite; }
    .arrow { fill: none; stroke-width: 2; }
    @keyframes flow { to { stroke-dashoffset: -14; } }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
  </style>

  <rect class="card-bg" x="0.5" y="0.5" width="999" height="249"/>
  <rect class="card-bd" x="0.5" y="0.5" width="999" height="249"/>

  <text class="mono t-subtle" x="28" y="36" font-size="12" letter-spacing="2">CV_PIPELINE // HOW_I_BUILD</text>
  <circle class="live pulse" cx="866" cy="32" r="4"/>
  <text class="mono live" x="878" y="36" font-size="12" letter-spacing="2">TRAINING</text>

  <!-- 01 DATA -->
  <rect class="stage-bg" x="33" y="66" width="196" height="150"/>
  <rect class="stage s1" x="33" y="66" width="196" height="150"/>
  <rect class="c1" x="33" y="66" width="196" height="4"/>
  <text class="mono c1" x="51" y="100" font-size="11">01</text>
  <text class="t-title" x="51" y="124" font-size="17" font-weight="800" letter-spacing="1">DATA</text>
  <text class="mono c1" x="51" y="144" font-size="10.5" font-weight="bold">OPENCV · NUMPY</text>
  <rect class="track" x="51" y="156" width="160" height="3"/>
  <rect class="c1" x="51" y="156" width="40" height="3"/>
  <text class="mono t-subtle" x="51" y="180" font-size="11">images / video / prompts</text>
  <text class="mono t-subtle" x="51" y="197" font-size="11">clean + augment</text>

  <line class="flow s1" x1="233" y1="141" x2="275" y2="141"/>
  <path class="arrow s1" d="M269 136 L275 141 L269 146"/>

  <!-- 02 MODEL -->
  <rect class="stage-bg" x="279" y="66" width="196" height="150"/>
  <rect class="stage s2" x="279" y="66" width="196" height="150"/>
  <rect class="c2" x="279" y="66" width="196" height="4"/>
  <text class="mono c2" x="297" y="100" font-size="11">02</text>
  <text class="t-title" x="297" y="124" font-size="17" font-weight="800" letter-spacing="1">MODEL</text>
  <text class="mono c2" x="297" y="144" font-size="10.5" font-weight="bold">PYTORCH · DIFFUSERS</text>
  <rect class="track" x="297" y="156" width="160" height="3"/>
  <rect class="c2" x="297" y="156" width="80" height="3"/>
  <text class="mono t-subtle" x="297" y="180" font-size="11">CNN · ViT · diffusion</text>
  <text class="mono t-subtle" x="297" y="197" font-size="11">pretrained backbones</text>

  <line class="flow s2" x1="479" y1="141" x2="521" y2="141"/>
  <path class="arrow s2" d="M515 136 L521 141 L515 146"/>

  <!-- 03 TRAIN & EVAL -->
  <rect class="stage-bg" x="525" y="66" width="196" height="150"/>
  <rect class="stage s3" x="525" y="66" width="196" height="150"/>
  <rect class="c3" x="525" y="66" width="196" height="4"/>
  <text class="mono c3" x="543" y="100" font-size="11">03</text>
  <text class="t-title" x="543" y="124" font-size="17" font-weight="800" letter-spacing="1">TRAIN &amp; EVAL</text>
  <text class="mono c3" x="543" y="144" font-size="10.5" font-weight="bold">LIGHTNING · W&amp;B · CUDA</text>
  <rect class="track" x="543" y="156" width="160" height="3"/>
  <rect class="c3" x="543" y="156" width="120" height="3"/>
  <text class="mono t-subtle" x="543" y="180" font-size="11">mixed precision on GPU</text>
  <text class="mono t-subtle" x="543" y="197" font-size="11">FID · FVD · LPIPS</text>

  <line class="flow s3" x1="725" y1="141" x2="767" y2="141"/>
  <path class="arrow s3" d="M761 136 L767 141 L761 146"/>

  <!-- 04 DEPLOY -->
  <rect class="stage-bg" x="771" y="66" width="196" height="150"/>
  <rect class="stage s4" x="771" y="66" width="196" height="150"/>
  <rect class="c4" x="771" y="66" width="196" height="4"/>
  <text class="mono c4" x="789" y="100" font-size="11">04</text>
  <text class="t-title" x="789" y="124" font-size="17" font-weight="800" letter-spacing="1">DEPLOY</text>
  <text class="mono c4" x="789" y="144" font-size="10.5" font-weight="bold">ONNX · TENSORRT · GRADIO</text>
  <rect class="track" x="789" y="156" width="160" height="3"/>
  <rect class="c4" x="789" y="156" width="160" height="3"/>
  <text class="mono t-subtle" x="789" y="180" font-size="11">optimized inference</text>
  <text class="mono t-subtle" x="789" y="197" font-size="11">demo apps &amp; APIs</text>
</svg>
