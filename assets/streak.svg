  <text class="t-subtle" x="166" y="120" font-size="12" text-anchor="middle">Nov 21, 2022 – Present</text>

  <circle class="glow" cx="500" cy="58" r="36"/>
  <circle class="ring" cx="500" cy="58" r="36" stroke="url(#rainbow-ring)"/>
  <text fill="url(#cyan-slide)" x="500" y="70" font-size="32" font-weight="700" text-anchor="middle">1</text>
  <text class="accent" x="500" y="114" font-size="15" font-weight="600" text-anchor="middle">Current Streak</text>
  <text class="t-subtle" x="500" y="132" font-size="12" text-anchor="middle">Nov 3, 2026</text>

  <text fill="url(#cyan-slide)" x="833" y="72" font-size="34" font-weight="700" text-anchor="middle">3</text>
  <text class="t-muted" x="833" y="100" font-size="15" text-anchor="middle">Longest Streak</text>
  <text class="t-subtle" x="833" y="120" font-size="12" text-anchor="middle">Oct 27, 2026 – Oct 29, 2026</text>

  <line class="divider" x1="60" y1="156" x2="940" y2="156"/>
  <line class="divider" x1="250" y1="172" x2="250" y2="214"/>
  <line class="divider" x1="500" y1="172" x2="500" y2="214"/>
  <line class="divider" x1="750" y1="172" x2="750" y2="214"/>
  <text class="tile-1" x="125" y="190" font-size="22" font-weight="700" text-anchor="middle">4</text><text class="t-muted" x="125" y="210" font-size="13" text-anchor="middle">Profile Views</text><text class="tile-2" x="375" y="190" font-size="22" font-weight="700" text-anchor="middle">5</text><text class="t-muted" x="375" y="210" font-size="13" text-anchor="middle">Public Repos</text><text class="tile-3" x="625" y="190" font-size="22" font-weight="700" text-anchor="middle">0</text><text class="t-muted" x="625" y="210" font-size="13" text-anchor="middle">Stars</text><text class="tile-4" x="875" y="190" font-size="22" font-weight="700" text-anchor="middle">1,443</text><text class="t-muted" x="875" y="210" font-size="13" text-anchor="middle">Days on GitHub</text>

  <text class="mono t-subtle" x="60" y="240" font-size="12">// last 30 days</text>
  <text class="mono t-subtle" x="940" y="240" font-size="12" text-anchor="end">updated 2026-11-03 11:20 ICT</text>
