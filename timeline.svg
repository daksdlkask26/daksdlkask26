<svg width="800" height="1050" viewBox="0 0 800 1050" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }

    .card-bg   { fill: #f6f8fa; }
    .card-bd   { fill: none; stroke: #d0d7de; stroke-width: 1; }
    .tl-line   { stroke: #d0d7de; stroke-width: 1; }
    .dot-ring  { fill: #ffffff; stroke-width: 2; }
    .t-title   { fill: #1f2328; }
    .t-muted   { fill: #636c76; }
    .t-subtle  { fill: #6e7781; }
    .tech-bg   { fill: #ffffff; stroke: #d0d7de; stroke-width: 1; }
    .ln-bg     { fill: #eaeef2; stroke: #d8dee4; stroke-width: 1; }

    .bg-green  { fill: #dafbe1; } .fg-green  { fill: #1a7f37; }
    .bg-blue   { fill: #ddf4ff; } .fg-blue   { fill: #0550ae; }
    .bg-purple { fill: #fbefff; } .fg-purple { fill: #6639ba; }
    .bg-pink   { fill: #ffeff7; } .fg-pink   { fill: #bf3989; }
    .bg-amber  { fill: #fff8c5; } .fg-amber  { fill: #9a6700; }
    .bg-emed   { fill: #dafbe1; } .fg-emed   { fill: #1a7f37; }

    .dot-1 { fill: #1a7f37; } .dot-2 { fill: #bf3989; }
    .dot-3 { fill: #6639ba; } .dot-4 { fill: #0969da; }
    .dot-5 { fill: #0969da; }

    @media (prefers-color-scheme: dark) {
      .card-bg  { fill: #161b22; }
      .card-bd  { stroke: #30363d; }
      .tl-line  { stroke: #21262d; }
      .dot-ring { fill: #0d1117; }
      .t-title  { fill: #e6edf3; }
      .t-muted  { fill: #848d97; }
      .t-subtle { fill: #6e7681; }
      .tech-bg  { fill: #0d1117; stroke: #30363d; }
      .ln-bg    { fill: #010409; stroke: #21262d; }

      .bg-green  { fill: #0f2d16; } .fg-green  { fill: #3fb950; }
      .bg-blue   { fill: #121d2f; } .fg-blue   { fill: #58a6ff; }
      .bg-purple { fill: #1d1236; } .fg-purple { fill: #a371f7; }
      .bg-pink   { fill: #2d0d1f; } .fg-pink   { fill: #f778ba; }
      .bg-amber  { fill: #2a1d04; } .fg-amber  { fill: #d29922; }
      .bg-emed   { fill: #0f2d16; } .fg-emed   { fill: #3fb950; }

      .dot-1 { fill: #3fb950; } .dot-2 { fill: #f778ba; }
      .dot-3 { fill: #a371f7; } .dot-4 { fill: #2f81f7; }
      .dot-5 { fill: #58a6ff; }
