  <rect x="422" y="160" width="108" height="16" class="tech-bg"/><text x="476" y="172" text-anchor="middle" font-size="10" class="mono t-muted">Computer Vision</text>
  <rect x="535" y="160" width="72" height="16" class="tech-bg"/><text x="571" y="172" text-anchor="middle" font-size="10" class="mono t-muted">3D Lighting</text>

